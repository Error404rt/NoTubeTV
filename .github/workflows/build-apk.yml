name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.icon }} icon APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - icon: original
            gradle_property: ""
          - icon: standard
            gradle_property: "-PappIcon=standard"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name sdkmanager -perm -111 | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: bash ./gradlew assembleDebug ${{ matrix.gradle_property }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "NoTubeTV-${{ matrix.icon }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTubeTV-${{ matrix.icon }}-debug
          path: NoTubeTV-${{ matrix.icon }}-debug.apk
